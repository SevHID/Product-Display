<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6c63ff">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <title>商品预览</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== 防伪码通知条（从 URL 读取） ===== -->
    <div id="code-notice" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#6c63ff; color:white; padding:16px 24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:9999; font-size:16px; max-width:90%; text-align:center; font-family:system-ui, -apple-system, sans-serif;">
        <span id="code-display"></span>
        <button id="copy-code-btn" style="margin-left:16px; background:white; color:#6c63ff; border:none; border-radius:8px; padding:6px 16px; font-weight:bold; cursor:pointer;">复制</button>
        <button id="close-notice-btn" style="margin-left:8px; background:transparent; color:white; border:1px solid white; border-radius:8px; padding:6px 12px; cursor:pointer;">×</button>
    </div>

    <!-- 轮播区域 -->
    <section id="carousel-container"></section>

    <!-- 搜索 + 筛选 + 排序 区域 -->
    <section id="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入商品名称搜索..." />
            <select id="category-select">
                <option value="">全部分类</option>
            </select>
            <select id="sort-select">
                <option value="default">默认排序</option>
                <option value="name_asc">名称 A → Z</option>
                <option value="name_desc">名称 Z → A</option>
            </select>
            <button id="search-btn">搜索</button>
            <button id="clear-btn">清空</button>
        </div>
        <div id="suggestions" class="suggestions-box"></div>
        <div id="search-tip"></div>
    </section>

    <!-- 商品列表 -->
    <section id="product-list"></section>

    <!-- 加载更多 -->
    <div id="load-more-container">
        <button id="load-more-btn" class="load-more-btn">加载更多</button>
        <p id="load-more-info"></p>
    </div>

    <!-- ===== 商品详情弹窗 (Modal) ===== -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <img id="modal-image" src="" alt="商品图片">
            <h2 id="modal-name"></h2>
            <p id="modal-category" class="modal-category"></p>
            <p id="modal-description"></p>
            <a id="modal-video" href="#" target="_blank" class="modal-video-btn">▶ 观看介绍视频</a>

            <!-- ========== 防伪验证区域 ========== -->
            <div class="verification-area" id="verification-area" style="display:none; margin-top:20px; padding-top:18px; border-top:2px dashed var(--border-light);">
                <p style="font-weight:600; margin-bottom:10px; color:var(--text-primary);">🔐 正品防伪验证</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <input type="text" id="verification-input" placeholder="请输入防伪码"
                           style="flex:2; min-width:180px; padding:10px 16px; border:2px solid var(--border-light); border-radius:var(--radius-full); font-size:14px; font-family:var(--font-family); outline:none; transition:all var(--transition-fast); background:var(--bg-body); color:var(--text-primary);">
                    <button id="verification-btn" style="padding:10px 24px; border:none; border-radius:var(--radius-full); font-weight:600; font-size:14px; font-family:var(--font-family); cursor:pointer; transition:all var(--transition-fast); background:var(--primary); color:white; box-shadow:0 4px 12px rgba(108,99,255,0.3);">验证正品</button>
                    <button id="verification-clear-btn" style="padding:10px 20px; border:none; border-radius:var(--radius-full); font-weight:500; font-size:14px; font-family:var(--font-family); cursor:pointer; transition:all var(--transition-fast); background:var(--border-light); color:var(--text-secondary);">清空</button>
                </div>
                <div id="verification-result" style="margin-top:12px; font-size:15px; font-weight:600; min-height:24px;"></div>

                <!-- ===== 历史记录展示区域 ===== -->
                <div id="verify-history" style="display:none; margin-top:15px; padding-top:12px; border-top:1px solid var(--border-light);">
                    <p style="font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:8px;">📋 查询记录</p>
                    <div id="history-list" style="font-size:13px; color:var(--text-secondary); line-height:1.8;"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
